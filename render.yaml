services:
  - type: web
    name: experience-intelligence-studio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: founder
      - key: OWNER_NAME
        value: Workspace owner
      - key: WORKSPACE_NAME
        value: Experience Intelligence team
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: experience-intelligence-db
          property: connectionString

databases:
  - name: experience-intelligence-db
    plan: free
    region: singapore
    databaseName: experience_intelligence
    user: eis_app
    ipAllowList: []
